<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0"> 
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Added Great Vibes for the calligraphy font -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&family=Great+Vibes&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<title>Surprise</title>

<style>
/* Global styles */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Montserrat', sans-serif;
}

h1, h2, #welcome h1 {
    font-family: 'Cormorant Garamond', serif;
}

body {
    overflow:hidden;
    background:black;
}

html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
}

.page{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:.6s;
}

.hidden{
    opacity:0;
    pointer-events:none;
}

/* Welcome Page Layout */
#welcome {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 20px;
    padding:30px;
    overflow: hidden;
}

/* Background Video Styling */
.bg-video {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
}

/* NEW: Top Left Calligraphy Container */
.top-left-branding {

    position: absolute;
    top: 25px;
    left: 30px;
    z-index: 10; 
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.calligraphy-title {
    font-family: 'Great Vibes', cursive;
    font-size:150px; /* Big, elegant calligraphy size */
    font-style: italic;
    color: #ffffff;
    line-height: 0.9;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
}

.calligraphy-subtext {
    font-family: 'Montserrat', sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.75);
    letter-spacing: 3px; /* Gives it a modern premium brand look */
    text-transform: uppercase;
    padding-left: 5px;
}

/* 

/* Ensure text/button are above the frost */
#welcome h1 {
    color: #fff;
    font-size: 3rem;
    z-index: 10;
    margin-bottom: 80px; 
}

#welcome button {
    padding: 16px 40px;
    border: none;
    border-radius: 40px;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: #fff;
    cursor: pointer;
    font-size: 1.1rem;
    transition: all 0.3s ease;
    
    position: absolute;
    top: 55%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10; 
}

#welcome button:hover {
    background: rgba(255, 255, 255, 0.4);
    transform: translate(-50%, -50%) scale(1.05);
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
}

/* Floating Container */
.floating-container {
    position: absolute;
    inset: 0;
    z-index: 5; 
    pointer-events: none;
}

/* Base floating element style */
.float-element {
    position: absolute;
    animation: float 8s ease-in-out infinite;
}

.float-emoji {
    position: absolute;
    white-space: nowrap; 
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
    z-index: 5;
    pointer-events: none;
    opacity: 0.7;
}

@keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.7; }
    50% { transform: translateY(-50px) rotate(10deg); opacity: 1; }
}

.float-element:nth-child(2) { animation-delay: 2s; }
.float-element:nth-child(3) { animation-delay: 4s; }
.float-element:nth-child(4) { animation-delay: 6s; }

/* SHOWCASE */
#showcase{
    background-repeat: no-repeat; 
    background-size: cover;          
    background-position: center;
    background-attachment: fixed;
    padding:30px;
    background-image: url('back.png');
}

.card {
    width: min(2500px, 95vw);
    height: min(920px, 90vh);
    backdrop-filter: blur(15px); 
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
    border-radius: 40px;
    display: flex;
    overflow: hidden;
    position: relative;
    transition: background 0.5s ease;
}

.left{
    width:40%;
    padding:80px 60px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.left h2{
    font-size:4rem;
    line-height:1;
    color:white;
    margin-bottom:20px;
    font-weight:900;
}

.left p{
    color:rgba(255,255,255,.9);
    line-height:1.8;
    font-size:1rem;
    max-width:420px;
}

.right{
    width:60%;
    position:relative;
    overflow:hidden;
}

.slide{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    transition:all .8s cubic-bezier(.2,.9,.2,1);
}

.slide img {
    height: 900px; /* Increased from 520px */
    width: 700px;  /* Added a distinct width for better portrait proportions */
    object-fit: cover; /* Changed from 'fill' to keep photos crisp and unstretched */

    user-select: none;
    pointer-events: none;
}


.active{
    left:50%;
    opacity:1;
    z-index:3;
    filter:none;
    transform:translate(-50%,-50%) scale(1);
}

.next {
    left: 85%; /* Adjusted from 78% to give the larger center image breathing room */
    opacity: .45;
    filter: blur(8px);
    transform: translate(-50%, -50%) scale(.75);
}


.prev{
    left:25%;
    opacity:0;
    transform:translate(-50%,-50%) scale(.6);
}

.hide{
    opacity:0;
    transform:translate(-50%,-50%) scale(.5);
}

.controls{
    position:absolute;
    bottom:40px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:20px;
}

.arrow{
    width:55px;
    height:55px;
    border-color: #5a5a5aab;
    border-radius:50%;
    background:#60606047;
    font-size:1.3rem;
    cursor:pointer;
    color: white;
}

#nextPage{
    position:absolute;
    bottom:40px;
    right:40px;
    padding:15px 30px;
    border:none;
    border-radius:30px;
    background:rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    cursor:pointer;
    display:none;
    color: white;
}

#final{
    background:white;
    font-size:3rem;
    font-weight:800;
    color:#222;
}

@media(max-width:900px){
    .card { flex-direction:column; height:100vh; border-radius:0; }
    .left { width:100%; padding:40px; }
    .left h2 { font-size:2.5rem; }
    .right { width:100%; flex:1; }
    
    /* Update this specific block inside the media query */
    .slide img { 
        height: 420px; /* Increased from 330px */
        width: 300px;  /* Maintained aspect ratio for mobile */
    } 
    
    .next { left:85%; }
}

</style>
</head>
<body>

<section id="welcome" class="page">
    <!-- Background Video Layer -->
    <video autoplay loop muted playsinline class="bg-video">
        <source src="video2.mp4" type="video/mp4">
    </video>

    <div class="top-left-branding">
        <div class="calligraphy-title">Tinks Birthday</div>
        <div class="calligraphy-subtext">a young lady ready for whatever life throws at her</div>
    </div>

    <!-- Frosted Glass Layer -->
    <div class="frosted-overlay"></div>

    <!-- Floating Emojis Layer -->
    <div class="floating-container"></div>

    <h1>A Little Surprise</h1>
    <button onclick="startExperience()">catch me if you can</button>
</section>

<section id="showcase" class="page hidden">
    <div class="card">
        <div class="left">
            <h2 id="title">Beautiful Moments</h2>
            <p id="description">Some people make life brighter simply by being in it.</p>
        </div>
        <div class="right" id="imageArea">
            <div class="slide"><img src="Her1.png"></div>
            <div class="slide"><img src="Her2.png"></div>
            <div class="slide"><img src="Her3.png"></div>
            <div class="slide"><img src="Her4.png"></div>
            <div class="slide"><img src="Her5.png"></div>
        </div>
        <div class="controls">
            <button class="arrow" onclick="previousSlide()">←</button>
            <button class="arrow" onclick="nextSlide()">→</button>
        </div>
        <button id="nextPage" onclick="openFinalPage()">Continue</button>
    </div>
</section>

<section id="final" class="page hidden">EMPTY PAGE</section>

<audio id="audio1" src="Song1.mp3" loop></audio>
<audio id="audio2" src="song2.mp3" loop></audio>

<!-- Confetti Script Link -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
const container = document.querySelector('.floating-container');
const emojis = ['💜', '🟣', '🎁', '💝', '🥰', '🎈', '🎉', '🌸', '⭐'];

function spawnEmojis() {
    for (let i = 0; i < 40; i++) {
        const emoji = document.createElement('div');
        emoji.className = 'float-element float-emoji';
        emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        
        emoji.style.left = Math.random() * 100 + 'vw';
        emoji.style.top = Math.random() * 100 + 'vh';
        
        emoji.style.fontSize = (Math.random() * 2 + 1) + 'rem';
        emoji.style.animationDuration = (Math.random() * 5 + 5) + 's';
        emoji.style.animationDelay = Math.random() * 5 + 's';
        
        container.appendChild(emoji);
    }
}
spawnEmojis();

const slidesData = [
  { 
    title: "Hyper-Focused on Your Unstoppable Gravity", 
    text: "Today the world should honestly just pause to appreciate how incredible you are. You have this captivating, magnetic charm that makes it impossible for anyone not to notice when you're around. You’re the perfect mix of gorgeous, brilliant, and completely unmatched, and watching you move through life is like seeing a rare phenomenon in real time. It’s your birthday, which means you get to be the absolute center of attention—exactly where you belong. Cheers to another year of you being the absolute finest, coolest, and most radiant person around.", 
    gradient: "radial-gradient(circle, rgba(99, 180, 255, 0.6), rgba(99, 180, 255, 0.2))" 
  },
  { 
    title: "Rare Frequency of Someone Utterly Otherworldly", 
    text: "Happy Birthday to the girl who effortlessly sets the bar way too high for everyone else. There is an ethereal quality to you—the way you speak, the way you effortlessly command a room, and that stunning confidence you wear so well. You are a total standout in a world full of ordinary things, and today is all about honoring that rare, beautiful presence of yours. I hope you get utterly spoiled today, because someone as mesmerizing and phenomenal as you deserves nothing less than the absolute best.", 
    gradient: "radial-gradient(circle, rgba(255, 107, 163, 0.6), rgba(255, 107, 163, 0.2))" 
  },
  { 
    title: "A Celebration of the Constellation That Is You", 
    text: "Happy Birthday to someone who is genuinely a masterpiece all on her own. If the universe spent thousands of years aligning stars just to create one perfect person, it completely hit the mark with you. You carry this rare, luminous energy that effortlessly brightens up every single space you step into, without even trying. Today is entirely about celebrating your brilliance, your laugh, and the absolute magic you bring into the world just by being yourself. You are completely irreplaceable, and I hope your day is just as stunning, vibrant, and unforgettable as you are.", 
    gradient: "radial-gradient(circle, rgba(168, 85, 247, 0.6), rgba(168, 85, 247, 0.2))" 
  },
  { 
    title: "A Supernova Wrapped in Human Form", 
    text: "Happy Birthday to a girl who is a literal supernova of style, beauty, and unmatched energy. Today marks the anniversary of the universe deciding to drop its absolute finest creation into the world. You carry this breathtaking, effortless confidence that makes it impossible to look away, and your laugh alone has more power than a galaxy of stars. This entire day belongs to you, and honestly, the world should just stand back and admire the absolute masterpiece you are. I hope you get celebrated with the exact same high-level energy and luxury that you naturally project every single day.", 
    gradient: "radial-gradient(circle, rgba(211,5,5,0.654), rgba(249,54,54,0.401))" 
  },
  { 
    title: "One More Thing...", 
    text: "There's something waiting for you.", 
    gradient: "radial-gradient(circle, rgba(249,207,22,0.732), rgba(247,249,22,0.406))" 
  }
];

const slides = document.querySelectorAll(".slide");
const card = document.querySelector(".card");
const title = document.getElementById("title");
const description = document.getElementById("description");
const nextPage = document.getElementById("nextPage");
let current = 0;

function updateSlides(){
    slides.forEach(slide => { slide.className="slide hide"; });
    slides[current].className="slide active";
    if(current < slides.length-1){ slides[current+1].className="slide next"; }
    if(current > 0){ slides[current-1].className="slide prev"; }

    title.textContent = slidesData[current].title;
    description.textContent = slidesData[current].text;
    card.style.backgroundImage = slidesData[current].gradient;
    card.style.backgroundColor = "transparent";

    if(current === slides.length-1){ nextPage.style.display="block"; }
    else{ nextPage.style.display="none"; }
}

function nextSlide(){ if(current < slides.length-1){ current++; updateSlides(); } }
function previousSlide(){ if(current > 0){ current--; updateSlides(); } }

document.getElementById("imageArea").addEventListener("click", nextSlide);

const btn = document.querySelector("#welcome button");
let moveTimer;

btn.addEventListener("mouseover", () => {
    moveTimer = setTimeout(() => {
        const newX = Math.random() * (window.innerWidth - btn.offsetWidth);
        const newY = Math.random() * (window.innerHeight - btn.offsetHeight);
        btn.style.left = `${newX}px`;
        btn.style.top = `${newY}px`;
    }, 500);
});

btn.addEventListener("mouseout", () => { clearTimeout(moveTimer); });
btn.addEventListener("click", () => { clearTimeout(moveTimer); });

function startExperience(){ 
    // Trigger the confetti burst celebration!
    confetti({
        particleCount: 140,
        spread: 80,
        origin: { y: 0.6 }
    });

    document.getElementById("welcome").classList.add("hidden");
    document.getElementById("audio1").play();
    setTimeout(()=>{ document.getElementById("showcase").classList.remove("hidden"); },300); 
}

function openFinalPage(){ 
    const audio1 = document.getElementById("audio1");
    const audio2 = document.getElementById("audio2");
    audio1.pause(); 
    audio1.currentTime = 0; 
    audio2.play(); 
    document.getElementById("showcase").classList.add("hidden"); 
    setTimeout(()=>{ document.getElementById("final").classList.remove("hidden"); },300); 
}

updateSlides();
</script>
</body>
</html>
